name: Native candidate installation verification
on:
  push:
    branches: [codex/macos-intel-verification]
    paths: [.github/workflows/intel-release-verification.yml]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.6.2 Apple Silicon DMG
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '44308180701'
          name: markion-macos-arm64
          path: signed
      - name: Verify and launch the Apple Silicon package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke-test-macos-release.sh signed/Markion_0.6.2_aarch64.dmg arm64 "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launch-arm64
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
