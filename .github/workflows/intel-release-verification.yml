name: Intel release verification
on:
  push:
    branches: [codex/macos-intel-verification]
    paths: [.github/workflows/intel-release-verification.yml]

permissions:
  actions: read
  contents: read

env:
  SIGNED_RUN_ID: ""

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Intel launch environment
        run: |
          uname -m
          sw_vers
          test "$(uname -m)" = x86_64
          spctl --status
          swift -e 'import Metal; print("Metal device:", MTLCreateSystemDefaultDevice()?.name ?? "unavailable")'
      - name: Download signed Intel DMG
        if: env.SIGNED_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SIGNED_RUN_ID }}
          name: markion-macos-x86_64
          path: signed
      - name: Verify and launch on Intel macOS
        if: env.SIGNED_RUN_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          test "$(uname -m)" = x86_64
          dmg=(signed/*.dmg)
          shasum -a 256 "${dmg[0]}"
          bash scripts/verify-macos-release.sh "${dmg[0]}" x86_64

          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach -quiet "$mount_dir"; rmdir "$mount_dir"' EXIT
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$mount_dir" "${dmg[0]}"
          app="$RUNNER_TEMP/Applications/Markion.app"
          mkdir -p "$(dirname "$app")"
          ditto "$mount_dir/Markion.app" "$app"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$app"
          xattr -p com.apple.quarantine "$app"
          syspolicy_check distribution "$app"
          swift -e 'import Metal; print("Metal device:", MTLCreateSystemDefaultDevice()?.name ?? "unavailable")'
          open -n "$app"
          swift - "$app" <<'SWIFT'
          import AppKit
          import CoreGraphics

          let path = URL(fileURLWithPath: CommandLine.arguments[1]).resolvingSymlinksInPath().path
          for _ in 0..<35 {
              if let app = NSWorkspace.shared.runningApplications.first(where: { $0.bundleURL?.resolvingSymlinksInPath().path == path }),
                 let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]],
                 windows.contains(where: { $0[kCGWindowOwnerPID as String] as? pid_t == app.processIdentifier && $0[kCGWindowLayer as String] as? Int == 0 }) {
                  print("Verified the installed Markion bundle opened a visible window on Intel macOS")
                  exit(0)
              }
              Thread.sleep(forTimeInterval: 1)
          }
          fputs("No visible Markion window was observed after installation\n", stderr)
          exit(1)
          SWIFT
      - name: Capture launch evidence
        if: always() && env.SIGNED_RUN_ID != ''
        run: screencapture -x "$RUNNER_TEMP/markion-intel.png"
      - uses: actions/upload-artifact@v4
        if: always() && env.SIGNED_RUN_ID != ''
        with:
          name: markion-intel-launch
          path: ${{ runner.temp }}/markion-intel.png
          if-no-files-found: ignore

  windows-install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate Windows installers
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '44283630532'
          name: markion-windows-x86_64
          path: signed
      - name: Smoke-test native and portable packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:RUNNER_TEMP 'markion-qa-nsis'
          $portable = Join-Path $env:RUNNER_TEMP 'markion-qa-portable'
          $fixture = Join-Path $env:RUNNER_TEMP 'markion-qa-fixtures'
          python docs/testing/fixtures/prepare.py prepare --output $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Fixture preparation failed' }

          $installer = Get-ChildItem -Path signed -Filter '*-setup.exe' | Select-Object -First 1
          $zip = Get-ChildItem -Path signed -Filter '*-portable.zip' | Select-Object -First 1
          Get-FileHash -Algorithm SHA256 -Path $installer.FullName, $zip.FullName
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$native" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "NSIS failed with exit code $($setup.ExitCode)" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $portable

          $env:APPDATA = Join-Path $fixture 'profile/roaming'
          $env:LOCALAPPDATA = Join-Path $fixture 'profile/local'
          foreach ($location in @($native, $portable)) {
              $binary = Get-ChildItem -Path $location -Recurse -Filter 'markion.exe' | Select-Object -First 1
              if (!$binary) { throw "Installed binary missing under $location" }
              $app = Start-Process -FilePath $binary.FullName -WorkingDirectory $binary.DirectoryName -PassThru
              try {
                  $deadline = (Get-Date).AddSeconds(30)
                  do {
                      Start-Sleep -Milliseconds 600
                      $app.Refresh()
                  } until ($app.HasExited -or $app.MainWindowHandle -ne 0 -or (Get-Date) -ge $deadline)
                  if ($app.HasExited -or $app.MainWindowHandle -eq 0) {
                      throw "No running Markion window at $($binary.FullName)"
                  }
                  Write-Host "Native Windows window opened at $($binary.FullName): $($app.MainWindowTitle)"
              } finally {
                  if (!$app.HasExited) {
                      $null = $app.CloseMainWindow()
                      if (!$app.WaitForExit(5000)) { Stop-Process -Id $app.Id }
                  }
              }
          }
