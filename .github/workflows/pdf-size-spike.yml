name: pdf-size-spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pdf-size-spike.yml"
      - "assets/plugins/**"
      - "config/pdf-viewing.json"
      - "crates/pdf-plugin/**"
      - "crates/pdf-viewer/**"
      - "crates/plugin-protocol/**"
      - "src/app/**"
      - "src/plugin_platform.rs"
      - "src/plugin_platform/**"
      - "scripts/*pdf*.ps1"
      - "scripts/verify-packaged-workspace.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packager.toml"
      - "THIRD_PARTY_NOTICES.md"

concurrency:
  group: pdf-size-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  native-size-spike:
    name: Optional PDF/core closure (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
            package_formats: nsis
            verify_formats: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            executable_suffix: ""
            package_formats: app,dmg
            verify_formats: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            package_formats: deb,appimage
            verify_formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: optional-pdf-${{ matrix.target }}
          cache-all-crates: true

      - name: Install Linux build dependencies and pinned Minisign
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libglib2.0-dev libssl-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev libasound2-dev
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-linux.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '9A599B48BA6EB7B1E80F12F36B94CECA7C00B7A5173C95C3EFC88D9822957E73') { throw 'Minisign digest mismatch.' }
          $toolRoot = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          tar -xzf $archive -C $toolRoot
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract Minisign.' }
          $binRoot = Join-Path $toolRoot 'minisign-linux/x86_64'
          chmod +x (Join-Path $binRoot 'minisign')
          $binRoot | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install pinned Minisign on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479') { throw 'Minisign digest mismatch.' }
          $toolRoot = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot -Force
          (Join-Path $toolRoot 'minisign-win64/x86_64') | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Minisign on macOS
        if: runner.os == 'macOS'
        shell: pwsh
        run: brew install minisign

      - name: Configure development trust root
        shell: pwsh
        run: |
          $public = Get-Content crates/plugin-protocol/tests/fixtures/signing/catalog-test.pub | Where-Object { $_ -and -not $_.StartsWith('untrusted comment:') } | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($public)) { throw 'Test public key is invalid.' }
          "MARKION_PLUGIN_PUBLIC_KEY=$($public.Trim())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --version 0.11.8 --locked --force

      - name: Build core without optional PDF payload
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed.' }
          cargo run --release --locked -p wechat-workspace --bin verify-bundle -- assets/marknice-workspace
          if ($LASTEXITCODE -ne 0) { throw 'Bundled workspace verification failed.' }
          cargo packager --release --config packager.toml --formats '${{ matrix.package_formats }}'
          if ($LASTEXITCODE -ne 0) { throw 'Core packaging failed.' }

      - name: Verify NSIS, DMG, DEB, and AppImage closure
        shell: pwsh
        run: |
          '${{ matrix.verify_formats }}'.Split(',') | ForEach-Object {
            ./scripts/verify-packaged-workspace.ps1 -Format $_ -ArtifactsRoot dist
          }

      - name: Build and measure optional PDF plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test-pdf-compliance.ps1
          cargo build --release --locked -p markion-plugin-protocol --bin plugin-package-inspect
          if ($LASTEXITCODE -ne 0) { throw 'Package inspector build failed.' }
          cargo build --release --locked -p markion-pdf-plugin --bin markion-plugin-pdf
          if ($LASTEXITCODE -ne 0) { throw 'Plugin worker build failed.' }
          $stageOutput = @(./scripts/stage-pdfium.ps1 -TargetTriple '${{ matrix.target }}')
          $stage = $stageOutput[-1] | ConvertFrom-Json
          $env:MARKION_PDFIUM_RUNTIME = $stage.runtime_path
          cargo test --release --locked -p markion-pdf-plugin --test native_worker -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native protocol smoke failed.' }
          $outputRoot = Join-Path $PWD 'target/pdf-size-reports/${{ matrix.target }}'
          if (Test-Path -LiteralPath $outputRoot) { Remove-Item -LiteralPath $outputRoot -Recurse -Force }
          $output = @(
            ./scripts/build-pdf-plugin-prototype.ps1 `
              -WorkerPath (Join-Path $PWD 'target/release/markion-plugin-pdf${{ matrix.executable_suffix }}') `
              -RuntimePath $stage.runtime_path `
              -NoticePath (Join-Path $PWD 'crates/pdf-plugin/THIRD_PARTY_NOTICES.md') `
              -TargetTriple '${{ matrix.target }}' `
              -SecretKeyPath (Join-Path $PWD 'crates/plugin-protocol/tests/fixtures/signing/catalog-test.key') `
              -PublicKeyPath (Join-Path $PWD 'crates/plugin-protocol/tests/fixtures/signing/catalog-test.pub') `
              -OutputRoot $outputRoot
          )
          $report = $output[-1] | ConvertFrom-Json
          $inspector = Join-Path $PWD 'target/release/plugin-package-inspect${{ matrix.executable_suffix }}'
          $smokePath = Join-Path $outputRoot 'one-page-smoke.pdf'
          $encodedFixture = (Get-Content crates/pdf-viewer/tests/fixtures/one-page-embedded.pdf.b64 -Raw) -replace '\s', ''
          [IO.File]::WriteAllBytes($smokePath, [Convert]::FromBase64String($encodedFixture))
          & $inspector $report.archive_path (Join-Path $PWD 'crates/plugin-protocol/tests/fixtures/signing/catalog-test.pub') (Join-Path $outputRoot 'verified 插件 extract') $smokePath
          if ($LASTEXITCODE -ne 0) { throw 'Signed plugin inspection or extracted health check failed.' }

      - name: Retain exact optional-PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-size-${{ matrix.target }}
          path: |
            target/pdf-size-reports/${{ matrix.target }}/size-report.json
            target/pdf-size-reports/${{ matrix.target }}/*.markion-plugin
          if-no-files-found: error
          retention-days: 30
