name: release

# Native builds are required because gpui uses each operating system's GPU
# backend. Main and pull-request builds verify packaging; v* tags also publish
# the generated installers as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build & package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            artifact_name: markion-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
            artifact_name: markion-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            artifact_name: markion-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libssl-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev \
            libasound2-dev

      # The public key is intentionally embedded only in the tagged Windows
      # binary. Untagged and local builds keep the browser-download path.
      - name: Configure updater public key for tagged builds
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || {
            echo "CARGO_PACKAGER_SIGN_PUBLIC_KEY is required for tagged releases" >&2
            exit 1
          }
          echo "MARKION_UPDATE_PUBLIC_KEY=$UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"

      # Each runner is native for its matrix target, and packager expects the
      # executable in target/release rather than target/<triple>/release.
      - name: Build release binary
        run: cargo build --release

      # Source installation matches the proven Medor workflow and avoids
      # cargo-packager config auto-detection issues seen with prebuilt binaries.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked --force

      - name: Package (${{ matrix.formats }})
        run: cargo packager --release --config packager.toml --formats ${{ matrix.formats }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  prepare-update:
    name: Sign Windows updater and build metadata
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Derive version without leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Validate updater signing configuration
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          CARGO_PACKAGER_SIGN_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          for name in \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD \
            CARGO_PACKAGER_SIGN_PUBLIC_KEY \
            OSS_PUBLIC_BASE \
            OSS_PREFIX
          do
            test -n "${!name}" || {
              echo "$name is required for tagged releases" >&2
              exit 1
            }
          done

      - name: Install cargo-packager signer
        run: |
          cargo install cargo-packager --version 0.11.8 --locked --force
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign Windows NSIS installer
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="dist/markion_${VERSION}_x64-setup.exe"
          test -f "$installer"
          cargo packager signer sign "$installer"
          test -s "$installer.sig"

      - name: Verify signing keypair and installer signature
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
        run: |
          installer="dist/markion_${VERSION}_x64-setup.exe"
          printf '%s' "$CARGO_PACKAGER_SIGN_PUBLIC_KEY" | base64 --decode > updater-public.key
          base64 --decode "$installer.sig" > updater-signature.sig
          minisign -Vm "$installer" -p updater-public.key -x updater-signature.sig

      - name: Build update.json
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          version = os.environ["VERSION"]
          installer = f"markion_{version}_x64-setup.exe"
          signature = pathlib.Path(f"dist/{installer}.sig").read_text().strip()
          base = (
              os.environ["OSS_PUBLIC_BASE"].rstrip("/")
              + "/"
              + os.environ["OSS_PREFIX"].strip("/")
              + "/latest"
          )
          out = {
              "version": version,
              "notes": f"Markion {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
              .isoformat()
              .replace("+00:00", "Z"),
              "platforms": {
                  "windows-x86_64": {
                      "url": f"{base}/{installer}",
                      "signature": signature,
                      "format": "nsis",
                  }
              },
          }
          pathlib.Path("dist/update.json").write_text(
              json.dumps(out, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(out, indent=2))
          PY

      - name: Upload signed updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: markion-update-metadata
          path: |
            dist/markion_${{ env.VERSION }}_x64-setup.exe.sig
            dist/update.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, prepare-update]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts to publish
        run: ls -laR dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Mirrors the tagged release's installers and packaging config to a domestic
  # Aliyun OSS Bucket at a stable `${OSS_PREFIX}/latest/` path, alongside a
  # generated `manifest.json` for mirror metadata and future clients.
  # Independent of the `release` job: a GitHub Release failure does not block
  # the mirror, and vice versa. Runs only on `v*` tags.
  #
  # The upload uses direct OSS REST PUTs signed with HMAC-SHA1 (curl + openssl,
  # both preinstalled on ubuntu runners) instead of a third-party action: the
  # previous tvrcgo/oss-action was fire-and-forget (silent no-op on empty globs,
  # unhandled-rejection crash on any network error, 60s SDK timeout). The job
  # then verifies that every mirrored object is publicly reachable with HTTP
  # 200, so a "successful" job always means the mirror actually works.
  mirror-oss:
    name: Mirror installers to Aliyun OSS
    needs: [build, prepare-update]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts to mirror
        run: ls -laR dist

      - name: Derive version without leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Compute SHA-256 digests for each installer
        run: |
          cd dist
          sha256sum *.exe *.dmg *.deb *.AppImage > sha256sums.txt
          cat sha256sums.txt

      - name: Build manifest.json
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          base = os.environ["OSS_PUBLIC_BASE"].rstrip("/") + "/" + os.environ["OSS_PREFIX"].rstrip("/") + "/latest"
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assets = {
              "windows-x86_64": f"markion_{version}_x64-setup.exe",
              "macos-aarch64":  f"Markion_{version}_aarch64.dmg",
              "linux-amd64":    f"markion_{version}_amd64.deb",
              "linux-appimage": f"markion_{version}_x86_64.AppImage",
          }
          out = {
              "version": version,
              "tag": os.environ["GITHUB_REF_NAME"],
              "pub_date": datetime.datetime.utcnow().isoformat() + "Z",
              "assets": {k: {"filename": v} for k, v in assets.items()},
          }
          pathlib.Path("dist/manifest.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Upload installers, updater metadata, packager config, manifest, and sha256sums to Aliyun OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          set -euo pipefail
          key_id="$OSS_ACCESS_KEY_ID"
          key_secret="$OSS_ACCESS_KEY_SECRET"
          bucket="$OSS_BUCKET"
          endpoint="${OSS_ENDPOINT#https://}"
          endpoint="${endpoint#http://}"
          # Defensive normalization: a trailing slash in OSS_PREFIX must never
          # produce double-slash object keys again (it made every mirrored URL
          # 404 while the job still reported success).
          prefix="${OSS_PREFIX%/}"
          prefix_dir="${prefix}/latest"

          upload() {
            local src="$1" dest="$2"
            local now content_type string_to_sign signature
            now="$(date -u '+%a, %d %b %Y %H:%M:%S GMT')"
            content_type="application/octet-stream"
            string_to_sign="PUT\n\n${content_type}\n${now}\n/${bucket}/${dest}"
            signature="$(printf '%b' "${string_to_sign}" | openssl dgst -sha1 -hmac "${key_secret}" -binary | base64 | tr -d '\n')"
            curl -fsS --retry 3 --retry-delay 3 \
              --connect-timeout 30 --max-time 600 \
              -X PUT \
              -H "Date: ${now}" \
              -H "Content-Type: ${content_type}" \
              -H "Authorization: OSS ${key_id}:${signature}" \
              --data-binary "@${src}" \
              "https://${bucket}.${endpoint}/${dest}" >/dev/null
            echo "Uploaded ${dest}"
          }

          upload "dist/markion_${VERSION}_x64-setup.exe" "${prefix_dir}/markion_${VERSION}_x64-setup.exe"
          upload "dist/Markion_${VERSION}_aarch64.dmg" "${prefix_dir}/Markion_${VERSION}_aarch64.dmg"
          upload "dist/markion_${VERSION}_amd64.deb" "${prefix_dir}/markion_${VERSION}_amd64.deb"
          upload "dist/markion_${VERSION}_x86_64.AppImage" "${prefix_dir}/markion_${VERSION}_x86_64.AppImage"
          upload "dist/markion_${VERSION}_x64-setup.exe.sig" "${prefix_dir}/markion_${VERSION}_x64-setup.exe.sig"
          upload "dist/update.json" "${prefix_dir}/update.json"
          upload "dist/manifest.json" "${prefix_dir}/manifest.json"
          upload "dist/sha256sums.txt" "${prefix_dir}/sha256sums.txt"
          upload "packager.toml" "${prefix_dir}/packager.toml"

      - name: Verify mirrored assets are publicly reachable
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          set -euo pipefail
          base="${OSS_PUBLIC_BASE%/}/${OSS_PREFIX#/}/latest"
          for f in \
            "markion_${VERSION}_x64-setup.exe" \
            "Markion_${VERSION}_aarch64.dmg" \
            "markion_${VERSION}_amd64.deb" \
            "markion_${VERSION}_x86_64.AppImage" \
            "markion_${VERSION}_x64-setup.exe.sig" \
            "update.json" \
            "manifest.json" \
            "sha256sums.txt" \
            "packager.toml"
          do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 300 "${base}/${f}")"
            test "${code}" = "200" || {
              echo "Mirror verification failed: ${base}/${f} returned HTTP ${code}" >&2
              exit 1
            }
            echo "Verified ${f}"
          done
          curl -fsSL "${base}/update.json" | grep -q "\"version\": \"${VERSION}\"" || {
            echo "Mirror verification failed: update.json version != ${VERSION}" >&2
            exit 1
          }
          echo "All mirrored assets verified at ${base}/"
