name: release

# Native builds are required because gpui uses each operating system's GPU
# backend. Main and pull-request builds verify packaging; v* tags also publish
# the generated installers as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mirror_tag:
        description: Existing stable tag whose published assets should be mirrored to OSS
        required: false
        type: string

concurrency:
  group: release-${{ inputs.mirror_tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-plugins:
    name: Build optional PDF plugin (${{ matrix.target }})
    if: github.event_name != 'workflow_dispatch' || inputs.mirror_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            executable_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: release-plugin-${{ matrix.target }}
          cache-all-crates: true

      - name: Install Linux build dependencies and pinned Minisign
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libglib2.0-dev libssl-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev libasound2-dev
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-linux.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '9A599B48BA6EB7B1E80F12F36B94CECA7C00B7A5173C95C3EFC88D9822957E73') { throw 'Minisign digest mismatch.' }
          $toolRoot = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          tar -xzf $archive -C $toolRoot
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract Minisign.' }
          $binRoot = Join-Path $toolRoot 'minisign-linux/x86_64'
          chmod +x (Join-Path $binRoot 'minisign')
          $binRoot | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install pinned Minisign on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479') { throw 'Minisign digest mismatch.' }
          $toolRoot = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot -Force
          (Join-Path $toolRoot 'minisign-win64/x86_64') | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Minisign on macOS
        if: runner.os == 'macOS'
        shell: pwsh
        run: brew install minisign

      - name: Configure repository test plugin key
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $keyRoot = Join-Path $env:RUNNER_TEMP 'markion-plugin-key'
          New-Item -ItemType Directory -Path $keyRoot -Force | Out-Null
          Copy-Item crates/plugin-protocol/tests/fixtures/signing/catalog-test.key (Join-Path $keyRoot 'plugin.key')
          Copy-Item crates/plugin-protocol/tests/fixtures/signing/catalog-test.pub (Join-Path $keyRoot 'plugin.pub')
          "MARKION_PLUGIN_KEY_ROOT=$keyRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure production plugin signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          PLUGIN_PRIVATE_KEY_BASE64: ${{ secrets.MARKION_PLUGIN_SIGN_PRIVATE_KEY }}
          PLUGIN_PUBLIC_KEY_BASE64: ${{ secrets.MARKION_PLUGIN_SIGN_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLUGIN_PRIVATE_KEY_BASE64) -or [string]::IsNullOrWhiteSpace($env:PLUGIN_PUBLIC_KEY_BASE64)) { throw 'Dedicated plugin signing secrets are required for tagged releases.' }
          $keyRoot = Join-Path $env:RUNNER_TEMP 'markion-plugin-key'
          New-Item -ItemType Directory -Path $keyRoot -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $keyRoot 'plugin.key'), [Convert]::FromBase64String($env:PLUGIN_PRIVATE_KEY_BASE64))
          [IO.File]::WriteAllBytes((Join-Path $keyRoot 'plugin.pub'), [Convert]::FromBase64String($env:PLUGIN_PUBLIC_KEY_BASE64))
          "MARKION_PLUGIN_KEY_ROOT=$keyRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, test, sign, and inspect PDF plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test-pdf-compliance.ps1
          cargo build --release --locked -p markion-plugin-protocol --bin plugin-package-inspect
          if ($LASTEXITCODE -ne 0) { throw 'Plugin package inspector build failed.' }
          cargo build --release --locked -p markion-pdf-plugin --bin markion-plugin-pdf
          if ($LASTEXITCODE -ne 0) { throw 'PDF plugin worker build failed.' }
          $stageOutput = @(./scripts/stage-pdfium.ps1 -TargetTriple '${{ matrix.target }}')
          $stage = $stageOutput[-1] | ConvertFrom-Json
          cargo run --release --locked -p markion-pdf-viewer --bin pdf-runtime-probe -- --runtime $stage.runtime_path
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PDFium probe failed.' }
          $env:MARKION_PDFIUM_RUNTIME = $stage.runtime_path
          cargo test --release --locked -p markion-pdf-viewer --test native_pdfium -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF fixture matrix failed.' }
          cargo test --release --locked -p markion-pdf-plugin --test native_worker -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF protocol worker matrix failed.' }
          $outputRoot = Join-Path $PWD 'target/release-plugin'
          if (Test-Path -LiteralPath $outputRoot) { Remove-Item -LiteralPath $outputRoot -Recurse -Force }
          $packageOutput = @(
            ./scripts/build-pdf-plugin-prototype.ps1 `
              -WorkerPath (Join-Path $PWD 'target/release/markion-plugin-pdf${{ matrix.executable_suffix }}') `
              -RuntimePath $stage.runtime_path `
              -NoticePath (Join-Path $PWD 'crates/pdf-plugin/THIRD_PARTY_NOTICES.md') `
              -TargetTriple '${{ matrix.target }}' `
              -SecretKeyPath (Join-Path $env:MARKION_PLUGIN_KEY_ROOT 'plugin.key') `
              -PublicKeyPath (Join-Path $env:MARKION_PLUGIN_KEY_ROOT 'plugin.pub') `
              -OutputRoot $outputRoot
          )
          $report = $packageOutput[-1] | ConvertFrom-Json
          $inspector = Join-Path $PWD 'target/release/plugin-package-inspect${{ matrix.executable_suffix }}'
          $smokePath = Join-Path $outputRoot 'one-page-smoke.pdf'
          $encodedFixture = (Get-Content crates/pdf-viewer/tests/fixtures/one-page-embedded.pdf.b64 -Raw) -replace '\s', ''
          [IO.File]::WriteAllBytes($smokePath, [Convert]::FromBase64String($encodedFixture))
          & $inspector $report.archive_path (Join-Path $env:MARKION_PLUGIN_KEY_ROOT 'plugin.pub') (Join-Path $outputRoot 'verified 插件 extract') $smokePath
          if ($LASTEXITCODE -ne 0) { throw 'Signed PDF plugin inspection or extracted health check failed.' }
          $archive = Get-Item -LiteralPath $report.archive_path
          Move-Item -LiteralPath (Join-Path $outputRoot 'size-report.json') -Destination (Join-Path $outputRoot "$($archive.Name).size-report.json")
          "$($report.archive_sha256)  $($archive.Name)" | Set-Content -LiteralPath (Join-Path $outputRoot "$($archive.Name).sha256") -Encoding utf8NoBOM
          Copy-Item crates/pdf-plugin/THIRD_PARTY_NOTICES.md (Join-Path $outputRoot "$($archive.Name).THIRD_PARTY_NOTICES.md")
          [ordered]@{ schema_version = 1; source_revision = '${{ github.sha }}'; target = '${{ matrix.target }}'; worker_package = 'markion-pdf-plugin'; pdfium_build = 7881; pdfium_binding = 'pdfium-render 0.9.3'; archive_sha256 = $report.archive_sha256 } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $outputRoot "$($archive.Name).provenance.json") -Encoding utf8NoBOM

      - name: Upload optional plugin assets
        uses: actions/upload-artifact@v4
        with:
          name: markion-plugin-${{ matrix.target }}
          path: |
            target/release-plugin/*.markion-plugin
            target/release-plugin/*.json
            target/release-plugin/*.sha256
            target/release-plugin/*.md
          if-no-files-found: error
          retention-days: 14

  prepare-plugin-catalog:
    name: Prepare signed plugin catalog
    needs: build-plugins
    if: github.event_name != 'workflow_dispatch' || inputs.mirror_tag == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and Minisign
        uses: dtolnay/rust-toolchain@stable

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Download plugin assets
        uses: actions/download-artifact@v4
        with:
          pattern: markion-plugin-*
          path: plugin-dist

      - name: Configure catalog signing key
        shell: pwsh
        env:
          PLUGIN_PRIVATE_KEY_BASE64: ${{ secrets.MARKION_PLUGIN_SIGN_PRIVATE_KEY }}
          PLUGIN_PUBLIC_KEY_BASE64: ${{ secrets.MARKION_PLUGIN_SIGN_PUBLIC_KEY }}
        run: |
          $keyRoot = Join-Path $env:RUNNER_TEMP 'markion-plugin-key'
          New-Item -ItemType Directory -Path $keyRoot -Force | Out-Null
          if ('${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:PLUGIN_PRIVATE_KEY_BASE64) -or [string]::IsNullOrWhiteSpace($env:PLUGIN_PUBLIC_KEY_BASE64)) { throw 'Dedicated plugin signing secrets are required for tagged releases.' }
            [IO.File]::WriteAllBytes((Join-Path $keyRoot 'plugin.key'), [Convert]::FromBase64String($env:PLUGIN_PRIVATE_KEY_BASE64))
            [IO.File]::WriteAllBytes((Join-Path $keyRoot 'plugin.pub'), [Convert]::FromBase64String($env:PLUGIN_PUBLIC_KEY_BASE64))
          } else {
            Copy-Item crates/plugin-protocol/tests/fixtures/signing/catalog-test.key (Join-Path $keyRoot 'plugin.key')
            Copy-Item crates/plugin-protocol/tests/fixtures/signing/catalog-test.pub (Join-Path $keyRoot 'plugin.pub')
          }
          "MARKION_PLUGIN_KEY_ROOT=$keyRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Finalize and sign tagged catalog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path catalog-dist -Force | Out-Null
          $sequence = ([long]'${{ github.run_number }}' * 1000) + [long]'${{ github.run_attempt }}'
          ./scripts/finalize-plugin-catalog.ps1 -BaseCatalogPath assets/plugins/catalog.json -ReportsRoot plugin-dist -OutputPath catalog-dist/catalog.json -ReleaseTag '${{ github.ref_name }}' -Repository '${{ github.repository }}' -Sequence $sequence
          ./scripts/sign-plugin-catalog.ps1 -CatalogPath catalog-dist/catalog.json -SecretKeyPath (Join-Path $env:MARKION_PLUGIN_KEY_ROOT 'plugin.key') -PublicKeyPath (Join-Path $env:MARKION_PLUGIN_KEY_ROOT 'plugin.pub')

      - name: Reuse development bootstrap catalog
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path catalog-dist -Force | Out-Null
          Copy-Item assets/plugins/catalog.json catalog-dist/catalog.json
          Copy-Item assets/plugins/catalog.json.minisig catalog-dist/catalog.json.minisig

      - name: Export the exact embedded public key
        shell: pwsh
        run: |
          $keyLine = @(Get-Content (Join-Path $env:MARKION_PLUGIN_KEY_ROOT 'plugin.pub') | Where-Object { $_ -and -not $_.StartsWith('untrusted comment:') })[-1]
          if ([string]::IsNullOrWhiteSpace($keyLine)) { throw 'Plugin public key is invalid.' }
          [IO.File]::WriteAllText((Join-Path $PWD 'catalog-dist/plugin-public-key-line.txt'), $keyLine.Trim(), [Text.UTF8Encoding]::new($false))
          Copy-Item catalog-dist/catalog.json catalog-dist/plugin-catalog.json
          Copy-Item catalog-dist/catalog.json.minisig catalog-dist/plugin-catalog.json.minisig
          $catalogHash = (Get-FileHash -Algorithm SHA256 catalog-dist/plugin-catalog.json).Hash.ToLowerInvariant()
          "$catalogHash  plugin-catalog.json" | Set-Content catalog-dist/plugin-catalog.json.sha256 -Encoding utf8NoBOM

      - name: Upload signed plugin catalog
        uses: actions/upload-artifact@v4
        with:
          name: markion-plugin-catalog
          path: catalog-dist/*
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build & package (${{ matrix.os }})
    needs: prepare-plugin-catalog
    if: github.event_name != 'workflow_dispatch' || inputs.mirror_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            artifact_name: markion-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
            artifact_name: markion-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            artifact_name: markion-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install signed bootstrap plugin catalog
        uses: actions/download-artifact@v4
        with:
          name: markion-plugin-catalog
          path: target/release-catalog

      - name: Embed the verified plugin trust root
        shell: pwsh
        run: |
          Copy-Item target/release-catalog/catalog.json assets/plugins/catalog.json -Force
          Copy-Item target/release-catalog/catalog.json.minisig assets/plugins/catalog.json.minisig -Force
          $keyLine = (Get-Content target/release-catalog/plugin-public-key-line.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($keyLine)) { throw 'Plugin public key is unavailable.' }
          "MARKION_PLUGIN_PUBLIC_KEY=$keyLine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libssl-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev \
            libasound2-dev

      - name: Verify PDF dependency features and notices
        shell: pwsh
        run: ./scripts/test-pdf-compliance.ps1

      # The public key is intentionally embedded only in the tagged Windows
      # binary. Untagged and local builds keep the browser-download path.
      - name: Configure updater public key for tagged builds
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || {
            echo "CARGO_PACKAGER_SIGN_PUBLIC_KEY is required for tagged releases" >&2
            exit 1
          }
          echo "MARKION_UPDATE_PUBLIC_KEY=$UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"

      # Each runner is native for its matrix target, and packager expects the
      # executable in target/release rather than target/<triple>/release.
      - name: Build release binary
        run: cargo build --release

      - name: Verify pinned MarkNice workspace source
        run: cargo run --release -p wechat-workspace --bin verify-bundle -- assets/marknice-workspace

      # Source installation matches the proven Medor workflow and avoids
      # cargo-packager config auto-detection issues seen with prebuilt binaries.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked --force

      - name: Package (${{ matrix.formats }})
        run: cargo packager --release --config packager.toml --formats ${{ matrix.formats }}

      - name: Verify packaged workspace and optional-payload closure (${{ matrix.formats }})
        shell: pwsh
        run: |
          '${{ matrix.formats }}'.Split(',') | ForEach-Object {
            ./scripts/verify-packaged-workspace.ps1 -Format $_ -ArtifactsRoot dist
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  prepare-update:
    name: Sign Windows updater and build metadata
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Derive version without leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Validate updater signing configuration
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          CARGO_PACKAGER_SIGN_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          for name in \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD \
            CARGO_PACKAGER_SIGN_PUBLIC_KEY \
            OSS_PUBLIC_BASE \
            OSS_PREFIX
          do
            test -n "${!name}" || {
              echo "$name is required for tagged releases" >&2
              exit 1
            }
          done

      - name: Install cargo-packager signer
        run: |
          cargo install cargo-packager --version 0.11.8 --locked --force
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign Windows NSIS installer
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="dist/markion_${VERSION}_x64-setup.exe"
          test -f "$installer"
          cargo packager signer sign "$installer"
          test -s "$installer.sig"

      - name: Verify signing keypair and installer signature
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
        run: |
          installer="dist/markion_${VERSION}_x64-setup.exe"
          printf '%s' "$CARGO_PACKAGER_SIGN_PUBLIC_KEY" | base64 --decode > updater-public.key
          base64 --decode "$installer.sig" > updater-signature.sig
          minisign -Vm "$installer" -p updater-public.key -x updater-signature.sig

      - name: Build update.json
        shell: bash
        run: |
          # GitHub-Release variant: the manifest attached to the Release names
          # the GitHub asset as the installer. The mirror-oss job derives the
          # OSS variant by rewriting only this URL, so both variants share the
          # identical version, signature, and format for the same signed file.
          # This job runs only on v* tag refs, so GITHUB_REF_NAME is the tag.
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          version = os.environ["VERSION"]
          installer = f"markion_{version}_x64-setup.exe"
          signature = pathlib.Path(f"dist/{installer}.sig").read_text().strip()
          url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/download/{os.environ['GITHUB_REF_NAME']}/{installer}"
          )
          out = {
              "version": version,
              "notes": f"Markion {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
              .isoformat()
              .replace("+00:00", "Z"),
              "platforms": {
                  "windows-x86_64": {
                      "url": url,
                      "signature": signature,
                      "format": "nsis",
                  }
              },
          }
          pathlib.Path("dist/update.json").write_text(
              json.dumps(out, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(out, indent=2))
          PY

      - name: Upload signed updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: markion-update-metadata
          path: |
            dist/markion_${{ env.VERSION }}_x64-setup.exe.sig
            dist/update.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-plugins, prepare-plugin-catalog, prepare-update]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts to publish
        run: ls -laR dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Mirrors the tagged release's installers and packaging config to a domestic
  # Aliyun OSS Bucket at a stable `${OSS_PREFIX}/latest/` path, alongside a
  # generated `manifest.json` for mirror metadata and future clients.
  # The mirrored `update.json` is the Release's manifest with its installer
  # URL rewritten to the OSS host, so each distribution channel serves a
  # self-consistent manifest/installer pair with identical signatures.
  # Independent of the `release` job: a GitHub Release failure does not block
  # the mirror, and vice versa. Runs only on `v*` tags.
  #
  # The upload uses direct OSS REST PUTs signed with HMAC-SHA1 (curl + openssl,
  # both preinstalled on ubuntu runners) instead of a third-party action: the
  # previous tvrcgo/oss-action was fire-and-forget (silent no-op on empty globs,
  # unhandled-rejection crash on any network error, 60s SDK timeout). The job
  # then verifies that every mirrored object is publicly reachable with HTTP
  # 200, so a "successful" job always means the mirror actually works.
  mirror-oss:
    name: Mirror installers to Aliyun OSS
    needs: [build, build-plugins, prepare-plugin-catalog, prepare-update]
    if: >-
      ${{
        always() &&
        (
          (startsWith(github.ref, 'refs/tags/v') &&
            needs.build.result == 'success' &&
            needs['build-plugins'].result == 'success' &&
            needs['prepare-plugin-catalog'].result == 'success' &&
            needs.prepare-update.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && inputs.mirror_tag != '')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mirror_tag || github.ref }}

      - name: Derive release tag and version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.mirror_tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag, got: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download published release assets for mirror repair
        if: github.event_name == 'workflow_dispatch' && inputs.mirror_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern "markion_${VERSION}_x64-setup.exe" \
            --pattern "Markion_${VERSION}_aarch64.dmg" \
            --pattern "markion_${VERSION}_amd64.deb" \
            --pattern "markion_${VERSION}_x86_64.AppImage" \
            --pattern "markion_${VERSION}_x64-setup.exe.sig" \
            --pattern "update.json" \
            --pattern "dev.markion.pdf-*" \
            --pattern "plugin-catalog.json*"

      - name: List artifacts to mirror
        run: ls -laR dist

      - name: Compute SHA-256 digests for each installer
        run: |
          cd dist
          sha256sum *.exe *.dmg *.deb *.AppImage *.markion-plugin plugin-catalog.json > sha256sums.txt
          cat sha256sums.txt

      - name: Rewrite update.json installer URL to the OSS host
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          # OSS variant of the updater manifest: take the manifest published on
          # the GitHub Release (or downloaded from it in mirror-repair mode)
          # and point its installer URL at the OSS `latest/` object. Everything
          # else — version, pub_date, signature, format — stays identical
          # because both hosts serve the same signed installer file.
          python3 - <<'PY'
          import json
          import os
          import pathlib

          version = os.environ["VERSION"]
          installer = f"markion_{version}_x64-setup.exe"
          base = (
              os.environ["OSS_PUBLIC_BASE"].rstrip("/")
              + "/"
              + os.environ["OSS_PREFIX"].strip("/")
              + "/latest"
          )
          path = pathlib.Path("dist/update.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["platforms"]["windows-x86_64"]["url"] = f"{base}/{installer}"
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Build manifest.json
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
          RELEASE_TAG: ${{ inputs.mirror_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          base = os.environ["OSS_PUBLIC_BASE"].rstrip("/") + "/" + os.environ["OSS_PREFIX"].rstrip("/") + "/latest"
          release_tag = os.environ["RELEASE_TAG"]
          version = release_tag.lstrip("v")
          assets = {
              "windows-x86_64": f"markion_{version}_x64-setup.exe",
              "macos-aarch64":  f"Markion_{version}_aarch64.dmg",
              "linux-amd64":    f"markion_{version}_amd64.deb",
              "linux-appimage": f"markion_{version}_x86_64.AppImage",
          }
          out = {
              "version": version,
              "tag": release_tag,
              "pub_date": datetime.datetime.utcnow().isoformat() + "Z",
              "assets": {k: {"filename": v} for k, v in assets.items()},
          }
          pathlib.Path("dist/manifest.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Upload installers, updater metadata, packager config, manifest, and sha256sums to Aliyun OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          set -euo pipefail
          key_id="$OSS_ACCESS_KEY_ID"
          key_secret="$OSS_ACCESS_KEY_SECRET"
          bucket="$OSS_BUCKET"
          endpoint="${OSS_ENDPOINT#https://}"
          endpoint="${endpoint#http://}"
          # Defensive normalization: a trailing slash in OSS_PREFIX must never
          # produce double-slash object keys again (it made every mirrored URL
          # 404 while the job still reported success).
          prefix="${OSS_PREFIX%/}"
          prefix_dir="${prefix}/latest"
          versioned_plugin_dir="${prefix}/releases/${RELEASE_TAG}"

          upload() {
            local src="$1" dest="$2"
            local url="https://${bucket}.${endpoint}/${dest}"
            local local_md5 remote_etag
            local now content_type string_to_sign signature attempt

            # A repair run can resume a failed mirror without re-uploading
            # objects that OSS already has byte-for-byte.
            local_md5="$(md5sum "${src}" | awk '{print tolower($1)}')"
            remote_etag="$(curl -fsSI --connect-timeout 30 --max-time 300 "${url}" 2>/dev/null \
              | tr -d '\r' \
              | awk -F': *' 'tolower($1) == "etag" {gsub(/"/, "", $2); print tolower($2)}' \
              | tail -n 1 || true)"
            if [[ -n "${remote_etag}" && "${remote_etag}" == "${local_md5}" ]]; then
              echo "Already mirrored ${dest}"
              return 0
            fi

            content_type="application/octet-stream"
            for attempt in 1 2 3 4; do
              # Recompute the Date and signature on every retry so a slow
              # upload cannot leave later attempts with expired credentials.
              now="$(date -u '+%a, %d %b %Y %H:%M:%S GMT')"
              string_to_sign="PUT\n\n${content_type}\n${now}\n/${bucket}/${dest}"
              signature="$(printf '%b' "${string_to_sign}" | openssl dgst -sha1 -hmac "${key_secret}" -binary | base64 | tr -d '\n')"
              if curl -fsS \
                --connect-timeout 30 --max-time 1800 \
                -X PUT \
                -H "Date: ${now}" \
                -H "Content-Type: ${content_type}" \
                -H "Authorization: OSS ${key_id}:${signature}" \
                --data-binary "@${src}" \
                "${url}" >/dev/null
              then
                echo "Uploaded ${dest}"
                return 0
              fi
              echo "Upload attempt ${attempt} failed for ${dest}" >&2
              sleep 3
            done
            echo "Failed to upload ${dest} after 4 attempts" >&2
            return 1
          }

          upload "dist/markion_${VERSION}_x64-setup.exe" "${prefix_dir}/markion_${VERSION}_x64-setup.exe"
          upload "dist/Markion_${VERSION}_aarch64.dmg" "${prefix_dir}/Markion_${VERSION}_aarch64.dmg"
          upload "dist/markion_${VERSION}_amd64.deb" "${prefix_dir}/markion_${VERSION}_amd64.deb"
          upload "dist/markion_${VERSION}_x86_64.AppImage" "${prefix_dir}/markion_${VERSION}_x86_64.AppImage"
          upload "dist/markion_${VERSION}_x64-setup.exe.sig" "${prefix_dir}/markion_${VERSION}_x64-setup.exe.sig"
          upload "dist/update.json" "${prefix_dir}/update.json"
          upload "dist/manifest.json" "${prefix_dir}/manifest.json"
          upload "dist/sha256sums.txt" "${prefix_dir}/sha256sums.txt"
          upload "packager.toml" "${prefix_dir}/packager.toml"
          for src in dist/dev.markion.pdf-* dist/plugin-catalog.json*; do
            test -f "${src}" || continue
            name="$(basename "${src}")"
            upload "${src}" "${prefix_dir}/${name}"
            upload "${src}" "${versioned_plugin_dir}/${name}"
          done

      - name: Verify mirrored assets are publicly reachable
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          set -euo pipefail
          base="${OSS_PUBLIC_BASE%/}/${OSS_PREFIX#/}/latest"
          for f in \
            "markion_${VERSION}_x64-setup.exe" \
            "Markion_${VERSION}_aarch64.dmg" \
            "markion_${VERSION}_amd64.deb" \
            "markion_${VERSION}_x86_64.AppImage" \
            "markion_${VERSION}_x64-setup.exe.sig" \
            "update.json" \
            "manifest.json" \
            "sha256sums.txt" \
            "packager.toml"
          do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 300 "${base}/${f}")"
            test "${code}" = "200" || {
              echo "Mirror verification failed: ${base}/${f} returned HTTP ${code}" >&2
              exit 1
            }
            echo "Verified ${f}"
          done
          curl -fsSL "${base}/update.json" | grep -q "\"version\": \"${VERSION}\"" || {
            echo "Mirror verification failed: update.json version != ${VERSION}" >&2
            exit 1
          }
          curl -fsSL "${base}/update.json" | grep -q "\"url\": \"${base}/markion_${VERSION}_x64-setup.exe\"" || {
            echo "Mirror verification failed: update.json installer URL is not on the OSS host" >&2
            exit 1
          }
          for src in dist/dev.markion.pdf-* dist/plugin-catalog.json*; do
            test -f "${src}" || continue
            f="$(basename "${src}")"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 300 "${base}/${f}")"
            test "${code}" = "200" || {
              echo "Mirror verification failed: ${base}/${f} returned HTTP ${code}" >&2
              exit 1
            }
            versioned="${OSS_PUBLIC_BASE%/}/${OSS_PREFIX#/}/releases/${RELEASE_TAG}/${f}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 300 "${versioned}")"
            test "${code}" = "200" || {
              echo "Versioned plugin mirror verification failed: ${versioned} returned HTTP ${code}" >&2
              exit 1
            }
          done
          echo "All mirrored assets verified at ${base}/"
