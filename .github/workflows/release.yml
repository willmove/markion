name: release

# Native builds are required because gpui uses each operating system's GPU
# backend. Main and pull-request builds verify packaging; v* tags also publish
# the generated installers as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mirror_tag:
        description: Existing stable tag whose published assets should be mirrored to OSS
        required: false
        type: string

concurrency:
  group: release-${{ inputs.mirror_tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build & package (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.mirror_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            verify_formats: deb,appimage,rpm
            artifact_name: markion-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
            verify_formats: app,dmg
            artifact_name: markion-macos-arm64
          # Cross-compiled on the arm64 runner: same-OS cross-compilation of
          # the Metal backend is fully supported, and Intel macOS runners are
          # being retired by GitHub.
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
            verify_formats: app,dmg
            artifact_name: markion-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            verify_formats: nsis,zip
            artifact_name: markion-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libssl-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev \
            libasound2-dev \
            rpm \
            rpm2cpio \
            cpio

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
          # AppImages need FUSE or --appimage-extract-and-run
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # Mesa lavapipe + Vulkan loader for the AppImage's software rendering
      # fallback (machines without a GPU or Vulkan driver). Building Mesa
      # takes a while, so the result is cached until the build script changes.
      - name: Cache software Vulkan stack
        if: runner.os == 'Linux'
        id: vulkan-stack-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/markion-vulkan
          key: markion-vulkan-${{ matrix.os }}-${{ hashFiles('scripts/build-lavapipe.sh') }}

      - name: Build software Vulkan stack
        if: runner.os == 'Linux' && steps.vulkan-stack-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y \
            python3-venv \
            python3-mako \
            python3-yaml \
            bison \
            flex \
            ninja-build \
            llvm-15-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxshmfence-dev \
            libxrandr-dev \
            libdrm-dev \
            zlib1g-dev
          bash scripts/build-lavapipe.sh "${{ runner.temp }}/markion-vulkan"

      # The public key is intentionally embedded only in the tagged Windows
      # and Linux binaries — the two platforms whose updater can install a
      # signed package (NSIS passive install / AppImage in-place replace).
      # Untagged and local builds keep the browser-download path.
      - name: Configure updater public key for tagged builds
        if: (runner.os == 'Windows' || runner.os == 'Linux') && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || {
            echo "CARGO_PACKAGER_SIGN_PUBLIC_KEY is required for tagged releases" >&2
            exit 1
          }
          echo "MARKION_UPDATE_PUBLIC_KEY=$UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"

      # Each runner is native for its matrix target except the cross-compiled
      # macOS x86_64 entry, which builds with an explicit --target into
      # target/<triple>/release (the packaging step below points the packager
      # there). All other entries keep the native target/release layout.
      - name: Build release binary
        run: cargo build --release ${{ matrix.target == 'x86_64-apple-darwin' && '--target x86_64-apple-darwin' || '' }}

      - name: Verify pinned MarkNice workspace source
        run: cargo run --release -p wechat-workspace --bin verify-bundle -- assets/marknice-workspace

      # Source installation matches the proven Medor workflow and avoids
      # cargo-packager config auto-detection issues seen with prebuilt binaries.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked --force

      - name: Package (${{ matrix.formats }})
        if: runner.os != 'macOS' || matrix.target == 'aarch64-apple-darwin'
        run: cargo packager --release --config packager.toml --formats ${{ matrix.formats }}

      # cargo-packager 0.11.8 parses --binaries-dir but never merges it into
      # the config (only out_dir/formats/target are merged), so the packager
      # reads binaries from packager.toml's `binaries-dir` (target/release),
      # where the cross build never puts anything. Stage the cross-built
      # binary at the path the config expects before packaging.
      - name: Stage cross binary for packager
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/markion target/release/markion

      # Cross-compiled x86_64: --target stamps the x64 arch into the DMG name
      # (Markion_<version>_x64.dmg), and CARGO_BUILD_TARGET keeps the
      # packager's before-packaging-command rebuilding the same cross target
      # instead of clobbering anything with a host-arch rebuild.
      - name: Package (${{ matrix.formats }}, cross x86_64)
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin
        run: cargo packager --release --config packager.toml --formats ${{ matrix.formats }} --target x86_64-apple-darwin

      # Runs before the permission fix so the bundled files are normalized too.
      - name: Bundle software Vulkan driver into AppImage
        if: runner.os == 'Linux'
        run: bash scripts/bundle-appimage-vulkan.sh dist/*.AppImage "${{ runner.temp }}/markion-vulkan"

      # cargo-packager 0.11.8 produces AppImages with restrictive permissions
      # (AppRun 0744, dirs 0700) that fail the AppImage catalog test when run
      # inside a firejail sandbox as a non-owner user. Extract, normalize all
      # permissions to world-readable (dirs 0755, AppRun/binary 0755, files
      # 0644), and repack before signing.
      - name: Fix AppImage permissions
        if: runner.os == 'Linux'
        run: bash scripts/fix-appimage-permissions.sh dist/*.AppImage

      # packager.toml seals macOS bundles with an ad-hoc signature
      # (signing-identity = "-"). Fail the build when that seal is missing so
      # an unsealed "app is damaged" bundle can never ship again.
      - name: Verify ad-hoc code signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "dist/Markion.app"
          codesign -dv "dist/Markion.app" 2>&1 | tee /tmp/codesign.txt
          grep -q "Signature=adhoc" /tmp/codesign.txt

      # cargo-packager has no zip/rpm formats; assemble those after NSIS/DEB.
      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-portable.ps1 -ArtifactsRoot dist

      - name: Package Linux RPM from DEB payload
        if: runner.os == 'Linux'
        run: bash scripts/build-linux-rpm.sh

      - name: Verify packaged MarkNice workspace (${{ matrix.verify_formats }})
        shell: pwsh
        run: |
          '${{ matrix.verify_formats }}'.Split(',') | ForEach-Object {
            ./scripts/verify-packaged-workspace.ps1 -Format $_ -ArtifactsRoot dist
          }

      # macOS artifacts upload only the DMG: the unpacked .app is never
      # published or mirrored (its verification ran above), and with two macOS
      # matrix entries both containing dist/Markion.app, merged artifact
      # downloads downstream would hit same-path conflicts with undefined
      # behavior.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.os == 'macOS' && 'dist/*.dmg' || 'dist/*' }}
          if-no-files-found: error
          retention-days: 14

  # Starts the packaged AppImage the way the AppImage catalog test does
  # (https://github.com/AppImage/appimage.github.io): Ubuntu 22.04, Xvfb +
  # icewm, the catalog's firejail build, `firejail --appimage`, and no Vulkan
  # driver on the system, so it can only pass through the bundled software
  # Vulkan fallback. Tagged releases are not published unless it passes.
  appimage-smoke:
    name: AppImage smoke test (no GPU, no Vulkan driver)
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.mirror_tag == ''
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: markion-linux-x86_64
          path: dist

      - name: Install the catalog test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            icewm \
            x11-utils \
            xdotool \
            imagemagick \
            libfuse2 \
            fuse \
            libgl1-mesa-dri \
            libosmesa6 \
            mesa-utils \
            libvulkan1
          # Same firejail build and install steps as the catalog's code/worker.sh.
          mkdir -p "$RUNNER_TEMP/firejail" && cd "$RUNNER_TEMP/firejail"
          wget -q https://github.com/AppImage/appimage.github.io/releases/download/deps/alpine-firejail-git20230825.tar.gz
          musl="$(wget -q https://dl-cdn.alpinelinux.org/alpine/v3.13/main/x86_64/ -O - | grep -o 'musl-1[^"]*\.apk' | head -n 1)"
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.13/main/x86_64/$musl"
          tar xf alpine-firejail-git20230825.tar.gz
          mkdir -p firejail
          tar xf musl-*.apk -C ./firejail/ 2>/dev/null || true
          tar xf firejail-0*.apk -C ./firejail/ 2>/dev/null || true
          sudo cp -Rf ./firejail/etc/* /etc/
          sudo cp -Rf ./firejail/lib/* /lib/
          sudo cp -Rf ./firejail/usr/* /usr/
          sudo chown root:root /usr/bin/firejail
          sudo chmod u+s /usr/bin/firejail
          firejail --version | head -n 1

      # Hosted runners may ship Mesa's Vulkan drivers; move their manifests
      # away so the test reproduces a machine without any Vulkan driver.
      - name: Remove system Vulkan drivers
        run: |
          for dir in /usr/share/vulkan/icd.d /etc/vulkan/icd.d /usr/local/share/vulkan/icd.d; do
            if [ -d "$dir" ]; then
              sudo mkdir -p "$RUNNER_TEMP/disabled-icd$dir"
              sudo find "$dir" -name '*.json' -exec mv -t "$RUNNER_TEMP/disabled-icd$dir" {} +
            fi
          done

      - name: Start the AppImage under firejail and wait for its window
        env:
          MARKION_SMOKE_REQUIRE_NO_VULKAN_DRIVER: '1'
        run: bash scripts/smoke-test-appimage.sh dist/*.AppImage "$RUNNER_TEMP/appimage-smoke"

      - name: Upload smoke test screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-smoke-test
          path: ${{ runner.temp }}/appimage-smoke
          if-no-files-found: ignore
          retention-days: 14

  prepare-update:
    name: Sign updater installers and build metadata
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: markion-*
          merge-multiple: true

      - name: Derive version without leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Validate updater signing configuration
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          CARGO_PACKAGER_SIGN_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          for name in \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY \
            CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD \
            CARGO_PACKAGER_SIGN_PUBLIC_KEY \
            OSS_PUBLIC_BASE \
            OSS_PREFIX
          do
            test -n "${!name}" || {
              echo "$name is required for tagged releases" >&2
              exit 1
            }
          done

      - name: Install cargo-packager signer
        run: |
          cargo install cargo-packager --version 0.11.8 --locked --force
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign Windows NSIS installer
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="dist/markion_${VERSION}_x64-setup.exe"
          test -f "$installer"
          cargo packager signer sign "$installer"
          test -s "$installer.sig"

      - name: Sign Linux AppImage
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          appimage="dist/markion_${VERSION}_x86_64.AppImage"
          test -f "$appimage"
          cargo packager signer sign "$appimage"
          test -s "$appimage.sig"

      - name: Verify signing keypair and installer signatures
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
        run: |
          printf '%s' "$CARGO_PACKAGER_SIGN_PUBLIC_KEY" | base64 --decode > updater-public.key
          for package in \
            "dist/markion_${VERSION}_x64-setup.exe" \
            "dist/markion_${VERSION}_x86_64.AppImage"
          do
            base64 --decode "$package.sig" > updater-signature.sig
            minisign -Vm "$package" -p updater-public.key -x updater-signature.sig
          done

      - name: Build update.json
        shell: bash
        run: |
          # GitHub-Release variant: the manifest attached to the Release names
          # the GitHub assets as the signed installers (Windows NSIS, Linux
          # AppImage). The mirror-oss job derives the OSS variant by rewriting
          # every platform URL, so both variants share the identical version,
          # signatures, and formats for the same signed files.
          # This job runs only on v* tag refs, so GITHUB_REF_NAME is the tag.
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          version = os.environ["VERSION"]
          installer = f"markion_{version}_x64-setup.exe"
          signature = pathlib.Path(f"dist/{installer}.sig").read_text().strip()
          url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/download/{os.environ['GITHUB_REF_NAME']}/{installer}"
          )
          appimage = f"markion_{version}_x86_64.AppImage"
          appimage_signature = pathlib.Path(f"dist/{appimage}.sig").read_text().strip()
          appimage_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/download/{os.environ['GITHUB_REF_NAME']}/{appimage}"
          )
          out = {
              "version": version,
              "notes": f"Markion {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
              .isoformat()
              .replace("+00:00", "Z"),
              "platforms": {
                  "windows-x86_64": {
                      "url": url,
                      "signature": signature,
                      "format": "nsis",
                  },
                  "linux-x86_64": {
                      "url": appimage_url,
                      "signature": appimage_signature,
                      "format": "appimage",
                  },
              },
          }
          pathlib.Path("dist/update.json").write_text(
              json.dumps(out, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(out, indent=2))
          PY

      - name: Upload signed updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: markion-update-metadata
          path: |
            dist/markion_${{ env.VERSION }}_x64-setup.exe.sig
            dist/markion_${{ env.VERSION }}_x86_64.AppImage.sig
            dist/update.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, appimage-smoke, prepare-update]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The pattern keeps the appimage-smoke-test screenshot and log out of
      # the published Release files.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: markion-*
          merge-multiple: true

      - name: List artifacts to publish
        run: ls -laR dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Mirrors the tagged release's installers and packaging config to a domestic
  # Aliyun OSS Bucket at a stable `${OSS_PREFIX}/latest/` path, alongside a
  # generated `manifest.json` for mirror metadata and future clients.
  # Packages: Windows NSIS + portable zip, macOS DMGs (arm64 + x64), Linux DEB + RPM + AppImage.
  # The mirrored `update.json` is the Release's manifest with every platform's
  # installer URL rewritten to the OSS host, so each distribution channel
  # serves a self-consistent manifest/installer pair with identical signatures.
  # Independent of the `release` job: a GitHub Release failure does not block
  # the mirror, and vice versa. Runs only on `v*` tags.
  #
  # The upload uses direct OSS REST PUTs signed with HMAC-SHA1 (curl + openssl,
  # both preinstalled on ubuntu runners) instead of a third-party action: the
  # previous tvrcgo/oss-action was fire-and-forget (silent no-op on empty globs,
  # unhandled-rejection crash on any network error, 60s SDK timeout). The job
  # then verifies that every mirrored object is publicly reachable with HTTP
  # 200, so a "successful" job always means the mirror actually works.
  mirror-oss:
    name: Mirror installers to Aliyun OSS
    needs: [build, appimage-smoke, prepare-update]
    if: >-
      ${{
        always() &&
        (
          (startsWith(github.ref, 'refs/tags/v') &&
            needs.build.result == 'success' &&
            needs.appimage-smoke.result == 'success' &&
            needs.prepare-update.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && inputs.mirror_tag != '')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mirror_tag || github.ref }}

      - name: Derive release tag and version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.mirror_tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag, got: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: markion-*
          merge-multiple: true

      - name: Download published release assets for mirror repair
        if: github.event_name == 'workflow_dispatch' && inputs.mirror_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern "markion_${VERSION}_x64-setup.exe" \
            --pattern "markion_${VERSION}_x64-portable.zip" \
            --pattern "Markion_${VERSION}_aarch64.dmg" \
            --pattern "Markion_${VERSION}_x64.dmg" \
            --pattern "markion_${VERSION}_amd64.deb" \
            --pattern "markion_${VERSION}_x86_64.rpm" \
            --pattern "markion_${VERSION}_x86_64.AppImage" \
            --pattern "markion_${VERSION}_x64-setup.exe.sig" \
            --pattern "markion_${VERSION}_x86_64.AppImage.sig" \
            --pattern "update.json"

      - name: List artifacts to mirror
        run: ls -laR dist

      - name: Compute SHA-256 digests for each installer
        run: |
          cd dist
          sha256sum *.exe *.dmg *.deb *.rpm *.AppImage *.zip > sha256sums.txt
          cat sha256sums.txt

      - name: Rewrite update.json installer URLs to the OSS host
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          # OSS variant of the updater manifest: take the manifest published on
          # the GitHub Release (or downloaded from it in mirror-repair mode)
          # and point every platform's installer URL at the OSS `latest/`
          # object named by that URL. Everything else — version, pub_date,
          # signatures, formats — stays identical because both hosts serve the
          # same signed installer files.
          python3 - <<'PY'
          import json
          import os
          import pathlib

          base = (
              os.environ["OSS_PUBLIC_BASE"].rstrip("/")
              + "/"
              + os.environ["OSS_PREFIX"].strip("/")
              + "/latest"
          )
          path = pathlib.Path("dist/update.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          for entry in manifest["platforms"].values():
              filename = entry["url"].rsplit("/", 1)[-1]
              entry["url"] = f"{base}/{filename}"
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Build manifest.json
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
          RELEASE_TAG: ${{ inputs.mirror_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          base = os.environ["OSS_PUBLIC_BASE"].rstrip("/") + "/" + os.environ["OSS_PREFIX"].rstrip("/") + "/latest"
          release_tag = os.environ["RELEASE_TAG"]
          version = release_tag.lstrip("v")
          assets = {
              "windows-x86_64": f"markion_{version}_x64-setup.exe",
              "windows-x86_64-portable": f"markion_{version}_x64-portable.zip",
              "macos-aarch64":  f"Markion_{version}_aarch64.dmg",
              "macos-x86_64":   f"Markion_{version}_x64.dmg",
              "linux-amd64":    f"markion_{version}_amd64.deb",
              "linux-rpm":      f"markion_{version}_x86_64.rpm",
              "linux-appimage": f"markion_{version}_x86_64.AppImage",
          }
          out = {
              "version": version,
              "tag": release_tag,
              "pub_date": datetime.datetime.utcnow().isoformat() + "Z",
              "assets": {k: {"filename": v} for k, v in assets.items()},
          }
          pathlib.Path("dist/manifest.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Upload installers, updater metadata, packager config, manifest, and sha256sums to Aliyun OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          set -euo pipefail
          key_id="$OSS_ACCESS_KEY_ID"
          key_secret="$OSS_ACCESS_KEY_SECRET"
          bucket="$OSS_BUCKET"
          endpoint="${OSS_ENDPOINT#https://}"
          endpoint="${endpoint#http://}"
          # Defensive normalization: a trailing slash in OSS_PREFIX must never
          # produce double-slash object keys again (it made every mirrored URL
          # 404 while the job still reported success).
          prefix="${OSS_PREFIX%/}"
          prefix_dir="${prefix}/latest"

          upload() {
            local src="$1" dest="$2"
            local url="https://${bucket}.${endpoint}/${dest}"
            local local_md5 remote_etag
            local now content_type string_to_sign signature attempt

            # A repair run can resume a failed mirror without re-uploading
            # objects that OSS already has byte-for-byte.
            local_md5="$(md5sum "${src}" | awk '{print tolower($1)}')"
            remote_etag="$(curl -fsSI --connect-timeout 30 --max-time 300 "${url}" 2>/dev/null \
              | tr -d '\r' \
              | awk -F': *' 'tolower($1) == "etag" {gsub(/"/, "", $2); print tolower($2)}' \
              | tail -n 1 || true)"
            if [[ -n "${remote_etag}" && "${remote_etag}" == "${local_md5}" ]]; then
              echo "Already mirrored ${dest}"
              return 0
            fi

            content_type="application/octet-stream"
            for attempt in 1 2 3 4; do
              # Recompute the Date and signature on every retry so a slow
              # upload cannot leave later attempts with expired credentials.
              now="$(date -u '+%a, %d %b %Y %H:%M:%S GMT')"
              string_to_sign="PUT\n\n${content_type}\n${now}\n/${bucket}/${dest}"
              signature="$(printf '%b' "${string_to_sign}" | openssl dgst -sha1 -hmac "${key_secret}" -binary | base64 | tr -d '\n')"
              if curl -fsS \
                --connect-timeout 30 --max-time 1800 \
                -X PUT \
                -H "Date: ${now}" \
                -H "Content-Type: ${content_type}" \
                -H "Authorization: OSS ${key_id}:${signature}" \
                --data-binary "@${src}" \
                "${url}" >/dev/null
              then
                echo "Uploaded ${dest}"
                return 0
              fi
              echo "Upload attempt ${attempt} failed for ${dest}" >&2
              sleep 3
            done
            echo "Failed to upload ${dest} after 4 attempts" >&2
            return 1
          }

          upload "dist/markion_${VERSION}_x64-setup.exe" "${prefix_dir}/markion_${VERSION}_x64-setup.exe"
          upload "dist/markion_${VERSION}_x64-portable.zip" "${prefix_dir}/markion_${VERSION}_x64-portable.zip"
          upload "dist/Markion_${VERSION}_aarch64.dmg" "${prefix_dir}/Markion_${VERSION}_aarch64.dmg"
          upload "dist/Markion_${VERSION}_x64.dmg" "${prefix_dir}/Markion_${VERSION}_x64.dmg"
          upload "dist/markion_${VERSION}_amd64.deb" "${prefix_dir}/markion_${VERSION}_amd64.deb"
          upload "dist/markion_${VERSION}_x86_64.rpm" "${prefix_dir}/markion_${VERSION}_x86_64.rpm"
          upload "dist/markion_${VERSION}_x86_64.AppImage" "${prefix_dir}/markion_${VERSION}_x86_64.AppImage"
          upload "dist/markion_${VERSION}_x64-setup.exe.sig" "${prefix_dir}/markion_${VERSION}_x64-setup.exe.sig"
          upload "dist/markion_${VERSION}_x86_64.AppImage.sig" "${prefix_dir}/markion_${VERSION}_x86_64.AppImage.sig"
          upload "dist/update.json" "${prefix_dir}/update.json"
          upload "dist/manifest.json" "${prefix_dir}/manifest.json"
          upload "dist/sha256sums.txt" "${prefix_dir}/sha256sums.txt"
          upload "packager.toml" "${prefix_dir}/packager.toml"

      - name: Verify mirrored assets are publicly reachable
        shell: bash
        env:
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          set -euo pipefail
          base="${OSS_PUBLIC_BASE%/}/${OSS_PREFIX#/}/latest"
          for f in \
            "markion_${VERSION}_x64-setup.exe" \
            "markion_${VERSION}_x64-portable.zip" \
            "Markion_${VERSION}_aarch64.dmg" \
            "Markion_${VERSION}_x64.dmg" \
            "markion_${VERSION}_amd64.deb" \
            "markion_${VERSION}_x86_64.rpm" \
            "markion_${VERSION}_x86_64.AppImage" \
            "markion_${VERSION}_x64-setup.exe.sig" \
            "markion_${VERSION}_x86_64.AppImage.sig" \
            "update.json" \
            "manifest.json" \
            "sha256sums.txt" \
            "packager.toml"
          do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 300 "${base}/${f}")"
            test "${code}" = "200" || {
              echo "Mirror verification failed: ${base}/${f} returned HTTP ${code}" >&2
              exit 1
            }
            echo "Verified ${f}"
          done
          curl -fsSL "${base}/update.json" | grep -q "\"version\": \"${VERSION}\"" || {
            echo "Mirror verification failed: update.json version != ${VERSION}" >&2
            exit 1
          }
          for installer in \
            "markion_${VERSION}_x64-setup.exe" \
            "markion_${VERSION}_x86_64.AppImage"
          do
            curl -fsSL "${base}/update.json" | grep -q "\"url\": \"${base}/${installer}\"" || {
              echo "Mirror verification failed: update.json ${installer} URL is not on the OSS host" >&2
              exit 1
            }
          done
          echo "All mirrored assets verified at ${base}/"
