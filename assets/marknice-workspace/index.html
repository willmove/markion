<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Markion · MarkNice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <link rel="stylesheet" href="static/workspace.css">
  <script defer src="static/vendor/marked.umd.js"></script>
  <script defer src="static/math-runtime.js"></script>
  <script defer src="static/vendor/tex-svg-full.js"></script>
  <script defer src="static/bridge.js"></script>
  <script defer src="static/theme-runtime.js"></script>
  <script defer src="static/marknice-format-runtime.js"></script>
  <script defer src="static/vendor/html-docx.js"></script>
  <script defer src="static/marknice-word-runtime.js"></script>
  <script defer src="static/export-runtime.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <strong>Markion · MarkNice</strong>
      <span id="documentName" class="document-name"></span>
    </div>
    <span id="status" role="status" aria-live="polite"></span>
  </header>
  <aside class="disclosure">
    <strong id="sessionDisclosure"></strong>
    <span id="privacyDisclosure"></span>
  </aside>
  <main class="workspace">
    <section class="editor-panel">
      <h1 id="editorHeading">Markdown</h1>
      <div id="markdownFormatToolbar" class="markdown-format-toolbar" role="toolbar" aria-label="Markdown formatting">
        <button type="button" data-md-action="heading1"><span aria-hidden="true">H1</span></button>
        <button type="button" data-md-action="heading2"><span aria-hidden="true">H2</span></button>
        <button type="button" data-md-action="heading3"><span aria-hidden="true">H3</span></button>
        <span class="format-separator" aria-hidden="true"></span>
        <button type="button" data-md-action="bold"><strong aria-hidden="true">B</strong></button>
        <button type="button" data-md-action="italic"><em aria-hidden="true">I</em></button>
        <button type="button" data-md-action="underline"><u aria-hidden="true">U</u></button>
        <span class="format-separator" aria-hidden="true"></span>
        <button type="button" data-md-action="orderedList"><span aria-hidden="true">1.</span></button>
        <button type="button" data-md-action="unorderedList"><span aria-hidden="true">•</span></button>
        <button type="button" data-md-action="code"><span aria-hidden="true">&lt;/&gt;</span></button>
        <button type="button" data-md-action="link"><span aria-hidden="true">↗</span></button>
        <button type="button" data-md-action="quote"><span aria-hidden="true">❞</span></button>
        <button type="button" data-md-action="codeBlock"><span aria-hidden="true">{ }</span></button>
        <button type="button" data-md-action="image"><span aria-hidden="true">▧</span></button>
        <button type="button" data-md-action="table"><span aria-hidden="true">▦</span></button>
      </div>
      <textarea id="markdown" spellcheck="true"></textarea>
    </section>
    <section class="preview-panel">
      <div class="toolbar">
        <label for="themeSelect" id="themeLabel">主题</label>
        <select id="themeSelect">
          <option value="claude">暖陶米白</option>
          <option value="minimal">极简留白</option>
          <option value="night">暗夜深色</option>
          <option value="simple">简洁蓝</option>
          <option value="elegant">优雅棕</option>
          <option value="vivid">活力红</option>
          <option value="amber">琥珀橙</option>
          <option value="green">清新绿</option>
          <option value="health">健康绿</option>
          <option value="magazine">杂志红</option>
          <option value="retro">复古纸</option>
          <option value="ocean">海盐青</option>
          <option value="tech">科技蓝</option>
          <option value="newspaper">报刊体</option>
          <option value="warmred">暖阳红</option>
        </select>
        <span id="fontSizeText">字号</span>
        <button id="fontSizeDown" type="button" aria-label="减小字号">−</button>
        <output id="fontSizeLabel">0</output>
        <button id="fontSizeUp" type="button" aria-label="增大字号">+</button>
        <span id="spacingText">段距</span>
        <button id="paraSpacingDown" type="button" aria-label="减小段距">−</button>
        <output id="paraSpacingLabel">0</output>
        <button id="paraSpacingUp" type="button" aria-label="增大段距">+</button>
        <button id="desktopModeBtn" class="active" type="button">桌面</button>
        <button id="phoneModeBtn" type="button">手机</button>
        <button id="copyMarkdownBtn" type="button">复制 Markdown</button>
        <button id="downloadHtmlBtn" type="button">下载 HTML</button>
        <button id="downloadDocxBtn" type="button">下载 DOCX</button>
        <button id="copyBtn" class="primary" type="button">复制到公众号</button>
      </div>
      <div id="warning" class="warning" hidden></div>
      <div id="previewContainer" class="preview-container">
        <article id="preview"></article>
      </div>
    </section>
  </main>
</body>
</html>
