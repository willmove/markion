# cargo-packager configuration (CrabNebula cargo-packager 0.11.x).
# Docs: https://docs.crabnebula.dev/packager/
#
# Format notes (verified from the crate's `Config` struct serde attributes):
#   - Keys are at the TOP LEVEL of this file. There is no `[packager]` wrapper
#     table in a standalone Packager.toml (that table form only exists inside
#     Cargo.toml as `[package.metadata.packager]`).
#   - cargo-packager accepts camelCase / kebab-case / snake_case for most keys
#     (via serde aliases). We use kebab-case to match the repo's own example.
#   - `formats` is a single top-level array; the CI workflow overrides it per OS
#     via `cargo packager --formats <list>`, so the value here is just a safe
#     default for a local `cargo packager --release` invocation.
#   - `[nsis]` and `[deb]` are top-level tables (siblings of `[windows]`/...),
#     NOT nested under `[windows]`/`[linux]`. Every struct has
#     `deny_unknown_fields`, so misspelled keys error out immediately.
#
# This file is consumed by .github/workflows/release.yml after each platform's
# native `cargo build --release` has produced target/release/markion. The packager
# then wraps that binary into:
#   - macOS:   .app + .dmg        (--formats app,dmg)
#   - Linux:   .deb + .AppImage   (--formats deb,appimage)
#   - Windows: NSIS .exe installer (--formats nsis)
#
# cargo-packager 0.11.x has no zip or rpm PackageFormat. CI additionally emits:
#   - Windows: markion_<version>_x64-portable.zip  (scripts/build-windows-portable.ps1)
#   - Linux:   markion_<version>_x86_64.rpm        (scripts/build-linux-rpm.sh, from the DEB payload)
# Those two artifacts still go through scripts/verify-packaged-workspace.ps1.
#
# NOTE on signing: Windows builds have no Authenticode certificate, so
# SmartScreen warns. macOS bundles are ad-hoc sealed by default (see [macos]
# below); the release workflow switches them to Developer ID signing plus
# Apple notarization when the Apple secrets are configured
# (docs/macos-signing.md). Only a notarized app opens after a browser
# download — current macOS rejects a quarantined ad-hoc bundle as "damaged".
# The Windows NSIS installer and the Linux AppImage are separately signed with
# minisign for the in-app updater; that authenticates update downloads but is
# not Authenticode or package-manager signing.
#
# Aliyun OSS mirror (release.yml `mirror-oss` job):
#   After a successful `v*` tag build, the release workflow also uploads the
#   seven packages (NSIS, portable zip, arm64 DMG, x64 DMG, DEB, RPM,
#   AppImage), updater `update.json` + both installer `.sig` files, this
#   `packager.toml`, a generated `manifest.json`,
#   and `sha256sums.txt` to an Aliyun OSS Bucket at:
#       ${OSS_PUBLIC_BASE}/${OSS_PREFIX}/latest/<filename>
#   The in-app "Check for Updates…" action discovers releases from GitHub's
#   latest-release API. Tagged Windows builds then use the stable
#   `update.json` asset (windows-x86_64/nsis entry) to authenticate and
#   install the NSIS package, and AppImage-launched tagged Linux builds use
#   the linux-x86_64/appimage entry to replace the running AppImage in place;
#   `manifest.json` remains general mirror metadata.
#   There is NO `[updater]` table here: cargo-packager 0.11.x's `Config` struct
#   has no `updater` field, and every config table is `deny_unknown_fields`,
#   so adding one breaks `cargo packager` immediately. Updater metadata and its
#   signature are produced by the workflow, not this packager config.

product-name = "Markion"
# `name` is the internal app/package identifier. Setting it explicitly is
# IMPORTANT: when omitted, cargo-packager tries to auto-derive it by walking
# the config file's parent (find_nearset_pkg_name), which does an unsafe
# set_current_dir() on the config *file path* and errors "Not a directory".
# Providing `name` skips that buggy path entirely.
name = "markion"
identifier = "dev.markion.app"
version = "0.5.2"
category = "Productivity"
publisher = "Willmove"
# cargo-packager 0.11.8 writes the Debian control `Maintainer` from this
# top-level list (joined with ", "). `[deb]` has no `maintainer` field;
# `deny_unknown_fields` rejects it and the release job fails at config parse.
authors = ["Willmove <willmove@qq.com>"]
homepage = "https://github.com/willmove/markion"
description = "A Rust + GPUI Markdown editor with live preview, themes, and i18n."
long-description = "Markion is a Rust + GPUI Markdown editor with live preview, themes, and i18n."

# All three icon files; the packager picks the right one per format
# (.ico → nsis/wix, .icns → app/dmg, .png → deb/appimage).
icons = [
    "assets/markion.ico",
    "assets/markion.icns",
    "assets/markion.png",
]
# Non-binary files bundled alongside the app (logo, icons for reuse).
resources = ["assets", "THIRD_PARTY_NOTICES.md"]

# The freshly built binary lives in target/release/markion (crate name = `markion`).
# `binaries` tells the packager which file(s) to wrap and which is the main
# executable. `path` is relative to `binaries-dir`.
binaries-dir = "target/release"
binaries = [{ path = "markion", main = true }]

# Build the binary fresh before packaging. The CI workflow also builds
# explicitly with the right --target, so this is a safety net for local
# `cargo packager --release` runs.
before-packaging-command = "cargo build --release"

out-dir = "dist"
log-level = "info"

# Default formats for a local `cargo packager --release` run. The CI matrix
# overrides this per OS via `--formats`, so this just needs to be valid.
formats = ["nsis", "app", "dmg", "deb", "appimage"]

# ---------------------------------------------------------------------------
# macOS options
# ---------------------------------------------------------------------------
[macos]
# Ad-hoc code signing ("-" identity, no Apple Developer account): seals the
# bundle (CodeResources, bound Info.plist) so the signature is valid. This is
# NOT Developer ID signing or notarization: Gatekeeper still rejects the
# quarantined app after a browser download. Keep this line exactly as is —
# scripts/configure-macos-signing.sh rewrites it to the Developer ID identity
# in CI when the Apple secrets exist, and cargo-packager then signs with the
# hardened runtime and notarizes. CI verifies the selected signature with
# `codesign --verify --deep --strict` (plus stapler/spctl when notarized).
signing-identity = "-"
# Minimum macOS version for the arm64 and x64 builds.
minimum-system-version = "11.0"

# ---------------------------------------------------------------------------
# Linux options
# ---------------------------------------------------------------------------
[linux]
# LinuxConfig's only field: emit the .desktop entry inside deb/AppImage.
generate-desktop-entry = true

[deb]
# gpui's Linux runtime deps (Wayland/X11/Vulkan/xkbcommon/fontconfig/alsa).
# Listed so `apt install ./markion_*.deb` pulls them in automatically.
depends = [
    "libwayland-client0",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxcb1",
    "libvulkan1",
    "libfontconfig1",
    "libasound2",
    "libglib2.0-0",
]
# cargo-packager 0.11.8 DebianConfig accepts only:
#   depends, desktop-template, section, priority, files, package-name
# (plus the camelCase / snake_case aliases of those names). It has no
# `recommends` field, so a DEB Recommends line cannot be set here.
# mesa-vulkan-drivers stays a soft suggestion on the RPM spec
# (scripts/build-linux-rpm.sh). The AppImage bundles lavapipe; deb users
# without a GPU install a Vulkan ICD themselves (docs/linux-gpu-troubleshooting.md).

# ---------------------------------------------------------------------------
# Windows options
# ---------------------------------------------------------------------------
[windows]
# NSIS digests; SHA-256 is the modern default.
digest-algorithm = "sha256"
allow-downgrades = true

# NSIS is a TOP-LEVEL table, not [windows.nsis].
[nsis]
# Install for the current user only (no UAC prompt, no admin needed) — safer
# default for an unsigned hobby/prototype distribution. Accepted values:
# "currentUser" (default), "perMachine", "both". The field is `installer-mode`
# (NOT `install-mode` — that key is rejected by the NSIS config struct).
installer-mode = "currentUser"
# Show a language selector on the installer's first page.
languages = ["English", "SimpChinese"]
display-language-selector = true
